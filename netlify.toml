[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ----------------------------------------------------------------
# Redirects for the new folder structure
# Keeps old URLs working so anyone with a bookmark to
# /services.html, /about.html, etc. still lands on the right page.
# ----------------------------------------------------------------
[[redirects]]
  from = "/about.html"
  to   = "/pages/about.html"
  status = 301

[[redirects]]
  from = "/services.html"
  to   = "/pages/services.html"
  status = 301

[[redirects]]
  from = "/certify.html"
  to   = "/pages/certify.html"
  status = 301

[[redirects]]
  from = "/contact.html"
  to   = "/pages/contact.html"
  status = 301

[[redirects]]
  from = "/founders.html"
  to   = "/pages/founders.html"
  status = 301

[[redirects]]
  from = "/login.html"
  to   = "/pages/login.html"
  status = 301

[[redirects]]
  from = "/dashboard.html"
  to   = "/pages/dashboard.html"
  status = 301

[[redirects]]
  from = "/admin.html"
  to   = "/pages/admin.html"
  status = 301
